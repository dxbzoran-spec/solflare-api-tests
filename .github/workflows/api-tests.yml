name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily run against the live API, catches regressions even without code changes.
  schedule:
    - cron: '0 6 * * *'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # API tests only: no browsers need to be installed.
      - name: Run API tests
        run: npm test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/
          retention-days: 14

      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit.xml
          detailed_summary: true
          include_passed: true
